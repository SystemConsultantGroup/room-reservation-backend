spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        order_inserts: true
        order_updates: true

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate.orm.jdbc.bind: OFF
    edu.skku.scg.reservation: INFO

cookie:
  secure: true