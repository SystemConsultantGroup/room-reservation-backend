spring:
  application:
    name: reservation

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

server:
  port: 8000

jwt:
  secret: ${JWT_SECRET}
  accessToken:
    expiration: 3600000
  registerToken:
    expiration: 900000